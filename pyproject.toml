[project]
name = "vaktsom"
version = "0.1.0"
description = "Drowning detection and lifeguard alerting for public swimming pools"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
    "av>=12",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "rfdetr[train,loggers]>=1.4",
    "pillow>=10",
    "tqdm>=4.66",
    "pandas>=2.2",
    "pycocotools>=2.0.7",
    "onnx>=1.16",
]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
vaktsom = "vaktsom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaktsom"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
