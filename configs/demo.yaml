  - {"id": "idrett-09", "name": "Idrett 9", "url": "sim://demo/idrett-09", "basins": ["idrett"], "size": [2688, 1512], "position": [-2.0, 22.0, 12.0], "target": [2.5, 17.5, 0.0], "hfov_deg": 100.0}
  - {"id": "idrett-10", "name": "Idrett 10", "url": "sim://demo/idrett-10", "basins": ["idrett"], "size": [2688, 1512], "position": [42.0, 27.0, 6.0], "target": [42.5, 22.5, 0.0], "hfov_deg": 100.0}
  - {"id": "stup-01", "name": "Stup 1", "url": "sim://demo/stup-01", "basins": ["stup"], "size": [2688, 1512], "position": [52.0, 11.0, 12.0], "target": [61.5, 12.5, 0.0], "hfov_deg": 100.0}
  - {"id": "stup-02", "name": "Stup 2", "url": "sim://demo/stup-02", "basins": ["stup"], "size": [2688, 1512], "position": [52.0, 19.0, 12.0], "target": [61.5, 17.5, 0.0], "hfov_deg": 100.0}
  - {"id": "bolge-01", "name": "Bølge 1", "url": "sim://demo/bolge-01", "basins": ["bolge"], "size": [2688, 1512], "position": [14.0, 30.0, 12.0], "target": [12.5, 39.5, 0.0], "hfov_deg": 100.0}
