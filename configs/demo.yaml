  - {"id": "barn-02", "name": "Barn 2", "url": "sim://demo/barn-02", "basins": ["barn"], "size": [2688, 1512], "position": [28.0, 42.0, 6.0], "target": [32.5, 36.5, 0.0], "hfov_deg": 80.0}

outputs:
  - {id: post-idrett, kind: panel, wired: true}
  - {id: post-fritid, kind: panel, wired: true}
  - {id: klokker, kind: wearable, wired: false}
  - {id: sirene-hall, kind: siren, wired: true, url: "http://192.0.2.10", options: {profile: Drukningsalarm, when: escalated}}
  - {id: logg, kind: log, wired: true}

escalation:
  ack_timeout_s: 10
  pre_alarm_to_alarm_s: 15
  repeat_s: 20

retention:
  clip_days: 7
  log_days: 30
